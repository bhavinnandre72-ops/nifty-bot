name: Crude Oil Auto Trading Bot

on:
  schedule:
    # कमोडिटी मार्केटच्या वेळेनुसार cron वेळ (उदा. संध्याकाळी किंवा हव्या त्या वेळी)
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

jobs:
  run-crude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Crude Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python crude_bot.py
          
